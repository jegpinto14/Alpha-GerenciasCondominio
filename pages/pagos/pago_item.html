<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesar Pago - Gerencias De Condominio</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/pagos.css">
    <link rel="stylesheet" href="../../assets/css/custom-select.css" />
    <link rel="stylesheet" href="../../assets/css/modal-confirm.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .pago-container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 2rem;
        }

        .pago-header {
            background: linear-gradient(135deg, #2a5298 0%, #1e3a6d 100%);
            color: white;
            padding: 2rem;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }

        .pago-header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 1.8rem;
        }

        .pago-header p {
            margin: 0;
            opacity: 0.9;
        }

        .pago-content {
            background: white;
            border: 1px solid #e5e7eb;
            border-top: none;
            border-radius: 0 0 12px 12px;
            padding: 2rem;
        }

        .item-info-card {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border: 2px solid #0ea5e9;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .item-info-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }

        .item-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #0c4a6e;
        }

        .item-price {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0ea5e9;
        }

        .item-description {
            color: #334155;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .item-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #bae6fd;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #0c4a6e;
            font-size: 0.9rem;
        }

        .detail-item i {
            color: #0ea5e9;
        }

        .payment-form {
            margin-top: 2rem;
        }

        .form-section {
            margin-bottom: 2rem;
        }

        .form-section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            color: #374151;
            margin-bottom: 0.5rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #2a5298;
            box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.1);
        }

        .comprobante-upload {
            border: 2px dashed #d1d5db;
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .comprobante-upload:hover {
            border-color: #2a5298;
            background: #f9fafb;
        }

        .comprobante-upload.has-file {
            border-color: #10b981;
            background: #d1fae5;
        }

        .upload-icon {
            font-size: 3rem;
            color: #9ca3af;
            margin-bottom: 1rem;
        }

        .comprobante-upload.has-file .upload-icon {
            color: #10b981;
        }

        .file-info {
            display: none;
            margin-top: 1rem;
            padding: 1rem;
            background: white;
            border-radius: 8px;
        }

        .comprobante-upload.has-file .file-info {
            display: block;
        }

        .payment-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px solid #e5e7eb;
        }

        .btn {
            flex: 1;
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2a5298 0%, #1e3a6d 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(42, 82, 152, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-content {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
        }

        .spinner {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #2a5298;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .banco-receptor-card {
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            border: 2px solid #22c55e;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .banco-receptor-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #15803d;
            font-size: 1.1rem;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid #bbf7d0;
        }

        .banco-receptor-header i {
            font-size: 1.3rem;
        }

        .banco-receptor-body {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .banco-detail {
            background: white;
            padding: 0.75rem;
            border-radius: 8px;
            border-left: 3px solid #22c55e;
        }

        .banco-detail-label {
            font-size: 0.75rem;
            color: #6b7280;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .banco-detail-value {
            font-size: 1rem;
            color: #15803d;
            font-weight: 600;
        }

        .file-preview {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: white;
            border-radius: 8px;
            margin-top: 1rem;
        }

        .file-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .file-name {
            font-weight: 600;
            color: #1f2937;
        }

        .file-size {
            font-size: 0.85rem;
            color: #6b7280;
        }

        .remove-file-btn {
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .remove-file-btn:hover {
            background: #dc2626;
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="pago-container">
        <div class="pago-header">
            <h1><i class="fas fa-credit-card"></i> Pago de Servicio</h1>
            <p>Complete la información para procesar su pago</p>
        </div>

        <div class="pago-content">
            <!-- Información del Item -->
            <div class="item-info-card">
                <div class="item-info-header">
                    <div class="item-name" id="itemName">Cargando...</div>
                    <div class="item-price" id="itemPrice">$0.00</div>
                </div>
                <div class="item-description" id="itemDescription"></div>
                <div class="item-details">
                    <div class="detail-item">
                        <i class="fas fa-home"></i>
                        <span id="inmuebleInfo">-</span>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-user"></i>
                        <span id="propietarioInfo">-</span>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-calendar"></i>
                        <span id="fechaSolicitud">-</span>
                    </div>
                </div>
            </div>

            <!-- Alerta de errores -->
            <div id="alertContainer"></div>

            <!-- Formulario de Pago -->
            <form id="paymentForm" class="payment-form" novalidate>
                <!-- Método de Pago -->
                <div class="form-section">
                    <div class="form-section-title">
                        <i class="fas fa-wallet"></i>
                        Método de Pago
                    </div>
                    <div class="form-group">
                        <label for="metodoPago">Seleccione el método de pago *</label>
                        <select id="metodoPago" name="metodo_pago" required>
                            <option value="">Cargando métodos...</option>
                        </select>
                    </div>
                </div>

                <!-- Formulario Grupo 1: Pago Móvil / Transferencia -->
                <div class="form-section" id="formGrupo1" style="display: none;">
                    <div class="form-section-title">
                        <i class="fas fa-university"></i>
                        Información Bancaria
                    </div>
                    
                    <!-- Banco Receptor -->
                    <div class="banco-receptor-card" id="bancoReceptorInfo">
                        <div class="banco-receptor-header">
                            <i class="fas fa-building"></i>
                            <strong>Datos del Banco Receptor</strong>
                        </div>
                        <div class="banco-receptor-body" id="bancoReceptorDetails">
                            <!-- Se llenará dinámicamente -->
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="fechaPagoG1">Fecha del Pago *</label>
                            <input type="date" id="fechaPagoG1" name="fecha_pago" required>
                        </div>
                        <div class="form-group">
                            <label for="montoBsG1">Monto a Pagar (Bs.) *</label>
                            <input type="text" id="montoBsG1" name="monto_bs" readonly>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="bancoEmisorG1">Banco Emisor *</label>
                            <select id="bancoEmisorG1" name="banco_emisor" required>
                                <option value="">Seleccione un banco</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="telefonoG1">Número de Teléfono *</label>
                            <input type="tel" id="telefonoG1" name="telefono" placeholder="04241234567" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="referenciaG1">Últimos 6 Dígitos de Referencia *</label>
                        <input type="text" id="referenciaG1" name="referencia" maxlength="6" pattern="[0-9]{6}" placeholder="123456" required>
                    </div>
                    
                    <!-- Información de Tasa -->
                    <div class="tasa-info" style="display: none; margin-top: 1rem; padding: 0.75rem; background: #f0f9ff; border-left: 3px solid #0ea5e9; border-radius: 6px; color: #0c4a6e; font-size: 0.9rem;"></div>
                </div>

                <!-- Formulario Grupo 2: Efectivo / Punto de Venta -->
                <div class="form-section" id="formGrupo2" style="display: none;">
                    <div class="form-section-title">
                        <i class="fas fa-money-bill-wave"></i>
                        Detalles del Pago
                    </div>
                    
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="fechaPagoG2">Fecha del Pago *</label>
                            <input type="date" id="fechaPagoG2" name="fecha_pago" required>
                        </div>
                        <div class="form-group">
                            <label for="montoBsG2">Monto a Pagar (Bs.) *</label>
                            <input type="text" id="montoBsG2" name="monto_bs" readonly>
                        </div>
                    </div>
                    
                    <!-- Información de Tasa -->
                    <div class="tasa-info" style="display: none; margin-top: 1rem; padding: 0.75rem; background: #f0f9ff; border-left: 3px solid #0ea5e9; border-radius: 6px; color: #0c4a6e; font-size: 0.9rem;"></div>
                </div>

                <!-- Comprobante (Solo para Grupo 1) -->
                <div class="form-section" id="comprobanteSection" style="display: none;">
                    <div class="form-section-title">
                        <i class="fas fa-file-upload"></i>
                        Comprobante de Pago
                    </div>
                    <div class="comprobante-upload" id="comprobanteUpload">
                        <input type="file" id="comprobanteFile" name="comprobante" accept="image/*,.pdf" style="display: none;">
                        <div class="upload-icon">
                            <i class="fas fa-cloud-upload-alt"></i>
                        </div>
                        <p><strong>Haga clic para seleccionar el comprobante</strong></p>
                        <p style="font-size: 0.85rem; color: #6b7280;">Formatos: JPG, PNG, PDF (Máx. 5MB)</p>
                        <div class="file-info">
                            <i class="fas fa-check-circle"></i>
                            <span id="fileName"></span>
                        </div>
                    </div>
                </div>

                <!-- Botones de Acción -->
                <div class="payment-actions">
                    <button type="button" class="btn btn-secondary" onclick="cancelarPago()">
                        <i class="fas fa-times"></i> Cancelar
                    </button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <i class="fas fa-check"></i> Procesar Pago
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <p>Procesando pago...</p>
        </div>
    </div>

    <script src="../../assets/js/modal-confirm.js"></script>
    <script src="../../assets/js/pago_item.js"></script>
</body>
</html>

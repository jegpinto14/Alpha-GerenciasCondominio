<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Gerencias De Condominio Admin</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/admin.css">
    <link rel="stylesheet" href="../../assets/css/custom-select.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1><i class="fas fa-building"></i> Gerencias De Condominio</h1>
                <div class="user-info">
                    <span id="adminName">Administrador</span>
                    <button onclick="logout()" class="btn btn-outline">
                        <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                    </button>
                </div>
            </div>
        </header>

        <div class="main-content">
            <div class="page-header">
                <h2><i class="fas fa-users"></i> Gestión de Usuarios</h2>
                <p>Crear y administrar usuarios del sistema</p>
            </div>

            <!-- Formulario para crear usuario -->
            <div class="user-management">
                <div class="user-form">
                    <h3><i class="fas fa-user-plus"></i> Crear Nuevo Usuario</h3>
                    <form id="createUserForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="username">Nombre de Usuario</label>
                                <input type="text" id="username" name="username" required>
                            </div>
                            <div class="form-group">
                                <label for="email">Correo Electrónico</label>
                                <input type="email" id="email" name="email" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="password">Contraseña</label>
                                <input type="password" id="password" name="password" required>
                            </div>
                            <div class="form-group">
                                <label for="confirmPassword">Confirmar Contraseña</label>
                                <input type="password" id="confirmPassword" name="confirmPassword" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="userType">Tipo de Usuario</label>
                                <select id="userType" name="userType" required>
                                    <option value="">Seleccionar tipo</option>
                                    <option value="residente">Residente</option>
                                    <option value="admin">Administrador</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="status">Estado</label>
                                <select id="status" name="status" required>
                                    <option value="activo">Activo</option>
                                    <option value="inactivo">Inactivo</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn-admin">
                                <i class="fas fa-user-plus"></i> Crear Usuario
                            </button>
                            <button type="button" onclick="clearForm()" class="btn-secondary">
                                <i class="fas fa-eraser"></i> Limpiar
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Lista de usuarios -->
                <div class="users-list">
                    <h3><i class="fas fa-list"></i> Usuarios Registrados</h3>
                    <div id="usersTableContainer">
                        <div style="text-align: center; padding: 2rem; color: #666;">
                            <i class="fas fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 1rem;"></i>
                            <p>Cargando usuarios...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Botón de volver -->
            <div class="page-actions">
                <button onclick="goBack()" class="btn-secondary">
                    <i class="fas fa-arrow-left"></i> Volver al Panel
                </button>
            </div>
        </div>
    </div>

    <script src="../../assets/js/navigation-protection.js"></script>
    <script src="../../assets/js/admin_usuarios.js"></script>
</body>
</html>

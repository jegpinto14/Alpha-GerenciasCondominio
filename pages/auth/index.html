<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerencias De Condominio - Sistema de Gestión de Pagos</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/images/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../assets/images/favicon/favicon-16x16.png">
    <link rel="manifest" href="../../assets/images/favicon/site.webmanifest">
    <style>
        :root {
            /* Paleta: Serenidad Arquitectónica */
            --color-primary: #1A3A4A;
            --color-secondary: #B8C2C8;
            --color-accent: #C4A98B;
            --color-background: #F8F9FA;
            --color-text-body: #1A3A4A;
            --color-text-inverse: #F8F9FA;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--color-background);
            color: var(--color-text-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card {
            background: white;
            border-radius: 16px;
            padding: 50px 40px;
            box-shadow: 0 10px 40px rgba(26, 58, 74, 0.12);
            border: 1px solid var(--color-secondary);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(26, 58, 74, 0.18);
        }

        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-section i {
            font-size: 3.5rem;
            color: var(--color-primary);
            margin-bottom: 20px;
            display: block;
        }

        .logo-section h1 {
            color: var(--color-primary);
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .logo-section p {
            color: #666;
            font-size: 0.95rem;
            font-weight: 400;
        }

        .login-form {
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: var(--color-primary);
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--color-secondary);
            border-radius: 10px;
            font-size: 1rem;
            font-family: 'Montserrat', sans-serif;
            transition: all 0.3s ease;
            background-color: var(--color-background);
            color: var(--color-text-body);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--color-accent);
            box-shadow: 0 0 0 4px rgba(196, 169, 139, 0.15);
            background-color: white;
        }

        .form-group input::placeholder {
            color: #999;
        }

        .password-input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-input-container input {
            padding-right: 50px;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--color-secondary);
            font-size: 1.1rem;
            padding: 8px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .password-toggle:hover {
            color: var(--color-accent);
            background-color: rgba(196, 169, 139, 0.1);
        }

        .password-toggle:focus {
            outline: none;
            color: var(--color-accent);
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background-color: var(--color-accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 600;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(196, 169, 139, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-login:hover {
            background-color: #d4b99b;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(196, 169, 139, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login i {
            font-size: 1.1rem;
        }

        .register-link {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid var(--color-secondary);
        }

        .register-link p {
            color: #666;
            font-size: 0.9rem;
        }

        .register-link a {
            color: var(--color-accent);
            font-weight: 600;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .register-link a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        /* Modal Styles */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(26, 58, 74, 0.5);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease-out;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(26, 58, 74, 0.3);
            border: 1px solid var(--color-secondary);
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-content {
            text-align: center;
        }

        .success-icon {
            margin-bottom: 20px;
        }

        .success-icon i {
            font-size: 4rem;
            color: #28a745;
        }

        .success-content h3 {
            color: var(--color-primary);
            font-size: 1.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .success-content p {
            color: #666;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .btn-success-modal {
            padding: 14px 30px;
            background-color: var(--color-accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(196, 169, 139, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-success-modal:hover {
            background-color: #d4b99b;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(196, 169, 139, 0.4);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-card {
                padding: 40px 30px;
            }

            .logo-section h1 {
                font-size: 1.75rem;
            }

            .logo-section i {
                font-size: 3rem;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <i class="fas fa-building"></i>
                <h1>Gerencias De Condominio</h1>
                <p>Sistema de Gestión de Pagos</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="password-input-container">
                        <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña"
                            required>
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <i class="fas fa-eye" id="passwordIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i>
                    Iniciar Sesión
                </button>
            </form>

            <div class="register-link">
                <p>¿No tienes cuenta? <a href="register.html">Regístrate aquí</a></p>
            </div>
        </div>
    </div>

    <!-- Modal de Login Exitoso -->
    <div id="successModal" class="modal" style="display: none;">
        <div class="modal-content success">
            <div class="success-content">
                <div class="success-icon">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h3>¡Login Exitoso!</h3>
                <p>Bienvenido al sistema de gestión de pagos.</p>
                <button onclick="closeSuccessModal()" class="btn-success-modal">
                    <i class="fas fa-check"></i> Continuar
                </button>
            </div>
        </div>
    </div>

    <script src="../../assets/js/navigation-protection.js"></script>
    <script src="../../assets/js/auth.js"></script>
</body>

</html>
